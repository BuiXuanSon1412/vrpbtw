# trainer/meta.yaml
# MAML (Model-Agnostic Meta-Learning) training configuration
#
# MAML trains policies that adapt quickly to new task distributions:
# - Maintains a task pool with multiple problem sizes and distributions
# - Inner loop: fast gradient steps on support set (K_inner iterations)
# - Outer loop: meta-gradient update on query set
# - Curriculum learning: gradually expand task difficulty during training

trainer:
  name: meta

  # Advantage estimation hyperparameters (used by trainer's collect methods)
  estimators:
    ppo:
      gamma: 0.99
      gae_lambda: 0.95

  agents:
    meta_agent:
      name: meta
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    sub_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    tune_agent:
      name: ppo
      learning_rate: 0.00005
      optimizer: adam
      clip_eps: 0.1
      value_coef: 0.2
      entropy_coef: 0.1
      max_grad_norm: 0.5
    eval_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5

  evaluators:
    meta_eval:
      agent: meta_agent
      n_episodes: 20
      deterministic: true
      decoding:
        beam_width: 1
    tune_eval:
      agent: tune_agent
      n_episodes: 100
      deterministic: false
      decoding:
        beam_width: 1 

  phases:
    meta_learning:
      enabled: false  # Set to false to skip meta-learning phase
      curriculum:
        entropy_threshold: 0.5
        check_interval: 1
      control:
        epochs: 200
        batches_per_epoch: 50
        eval_interval: 1
        checkpoint_interval: 10
      early_stopping:
        patience: 1000
        min_delta: 0.0001

    fine_tuning:
      enabled: true  # Set to false to skip fine-tuning phase (only meta-learning)
      control:
        # Rollout collection
        batch_size: 1             # Number of parallel environments (1=sequential, N>1=parallel with SubprocVecEnv)
        n_iteration: 100          # Number of rollout collections per task
        rollout_length: 256       # Timesteps per environment per rollout collection

        # PPO optimization on collected data
        ppo_epochs: 1             # Gradient steps per rollout (1=single pass, higher=risk of overfitting)
        minibatch_size: 32        # Mini-batch size for SGD over collected timesteps

        # Evaluation and checkpointing
        eval_interval: 1          # Evaluate every N iterations
        checkpoint_interval: 10
      early_stopping:
        patience: 1000
        min_delta: 0.0001
