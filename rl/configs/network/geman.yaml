# network/geman.yaml
# GEMAN Actor-Critic Policy Configuration
#
# Standard Transformer encoder architecture.
# Both NodeEncoder and VehicleEncoder follow the standard pattern:
# - Self-attention → Add & Norm
# - Feed-forward → Add & Norm
#
# Encoding order:
# 1. Node encoding (self-attention + feed-forward only)
# 2. Vehicle encoding (self-attention + feed-forward only)
# 3. Graph encoding (multi-relational GNN)

network:
  name: geman
  layers:
    encoder:
      node_encoder:
        embedding_dim: 128
        n_heads: 4
        n_layers: 4
        dropout: 0.1
        use_instance_norm: true
      vehicle_encoder:
        embedding_dim: 128
        n_heads: 4
        n_layers: 4
        dropout: 0.1
        use_instance_norm: true
      graph_encoder: mlp_mega

    decoder:
      node_decoder:
        embedding_dim: 128
        clip: 10.0
        context_hidden_dim: 128
        context_dropout: 0.1
      vehicle_decoder:
        embedding_dim: 128
        clip: 10.0
        context_hidden_dim: 128
        context_dropout: 0.1

    value_head:
      hidden_dims: [128, 128]
      use_dropout: true
      dropout: 0.1

# Graph Encoder Variants (for ablation studies)
# ============================================
# All variants use two-stage design:
# Stage 1: Project edge attributes [cost, time] → D-dim embeddings
# Stage 2: Different aggregation mechanisms per variant

graph_encoders:
  graph:
    description: "Original multi-relational GNN with raw edge attributes"
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false

  mlp_mega:
    description: "Simple MLP message passing with mean aggregation"
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false

  gcn_mega:
    description: "GCN-style symmetric degree normalization D^(-1/2) A D^(-1/2)"
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false

  gat_mega:
    description: "Multi-head attention with learned edge importance weights"
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false
    n_heads: 4
