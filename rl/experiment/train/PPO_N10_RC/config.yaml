trainer:
  name: meta
  collector:
    name: gae
    params:
      gamma: 0.99
      gae_lambda: 0.95
  agents:
    meta_agent:
      name: meta
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    sub_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    tune_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    eval_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
  evaluators:
    meta_eval:
      agent: meta_agent
      n_episodes: 20
      deterministic: true
      decoding:
        beam_width: 1
    tune_eval:
      agent: tune_agent
      n_episodes: 100
      deterministic: true
      decoding:
        beam_width: 1
  phases:
    meta_learning:
      enabled: false
      curriculum:
        entropy_threshold: 0.5
        check_interval: 1
      control:
        epochs: 200
        batches_per_epoch: 50
        eval_interval: 1
        checkpoint_interval: 10
      early_stopping:
        patience: 20
        min_delta: 0.0001
    fine_tuning:
      enabled: true
      control:
        epochs: 50
        batches_per_epoch: 200
        ppo_epochs: 1
        eval_interval: 1
        checkpoint_interval: 10
      early_stopping:
        patience: 10
        min_delta: 0.0001
network:
  name: geman
  layers:
    encoder:
      node_encoder:
        embedding_dim: 128
        n_heads: 4
        n_layers: 3
        dropout: 0.1
        use_instance_norm: true
      vehicle_encoder:
        embedding_dim: 128
        n_heads: 4
        n_layers: 3
        dropout: 0.1
        use_instance_norm: true
      graph_encoder:
        embedding_dim: 128
        n_layers: 3
        dropout: 0.1
    decoder:
      node_decoder:
        embedding_dim: 128
        clip: 10.0
        activation: relu
      vehicle_decoder:
        embedding_dim: 128
        clip: 10.0
        activation: relu
environment:
  name: mvrpbtw
  properties:
    max_coord: 100.0
    capacity_truck: 200
    capacity_drone: 20
    v_truck_km_h: 40.0
    v_drone_km_h: 60.0
    truck_cost_unit: 1.0
    drone_cost_unit: 0.5
    t_max_system_h: 24.0
    drone_duration_h: 1.0
    drone_takeoff_min: 1.0
    drone_landing_min: 1.0
    service_time_min: 5.0
    tasks:
    - 001_N10_F2_RC
device: cpu
reproducibility:
  seed:
    random_seed: 42
    numpy_seed: 42
    torch_seed: 42
experiment:
  name: PPO_N10_RC
  description: mvrpbtw experiment
logger:
  base_dir: experiment/train
  verbose: true
  tensorboard: false
