trainer:
  name: meta
  estimators:
    ppo:
      gamma: 0.99
      gae_lambda: 0.95
  agents:
    meta_agent:
      name: meta
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    sub_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    tune_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.1
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
    eval_agent:
      name: ppo
      learning_rate: 0.0001
      optimizer: adam
      clip_eps: 0.2
      value_coef: 0.5
      entropy_coef: 0.05
      max_grad_norm: 0.5
  evaluators:
    meta_eval:
      agent: meta_agent
      n_episodes: 20
      deterministic: true
      decoding:
        beam_width: 1
    tune_eval:
      agent: tune_agent
      n_episodes: 100
      deterministic: false
      decoding:
        beam_width: 1
  phases:
    meta_learning:
      enabled: false
      curriculum:
        entropy_threshold: 0.5
        check_interval: 1
      control:
        epochs: 200
        batches_per_epoch: 50
        eval_interval: 1
        checkpoint_interval: 10
      early_stopping:
        patience: 1000
        min_delta: 0.0001
    fine_tuning:
      enabled: true
      control:
        batch_size: 1
        n_iteration: 100
        rollout_length: 1024
        ppo_epochs: 1
        minibatch_size: 16
        eval_interval: 1
        checkpoint_interval: 10
      early_stopping:
        patience: 1000
        min_delta: 0.0001
network:
  name: geman
  layers:
    encoder:
      node_encoder:
        embedding_dim: 128
        n_heads: 4
        n_layers: 4
        dropout: 0.1
        use_instance_norm: true
      vehicle_encoder:
        embedding_dim: 128
        n_heads: 4
        n_layers: 4
        dropout: 0.1
        use_instance_norm: true
      graph_encoder: mlp_mega
    decoder:
      node_decoder:
        embedding_dim: 128
        clip: 10.0
        context_hidden_dim: 128
        context_dropout: 0.1
      vehicle_decoder:
        embedding_dim: 128
        clip: 10.0
        context_hidden_dim: 128
        context_dropout: 0.1
    value_head:
      hidden_dims:
      - 128
      - 128
      use_dropout: true
      dropout: 0.1
graph_encoders:
  graph:
    description: Original multi-relational GNN with raw edge attributes
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false
  mlp_mega:
    description: Simple MLP message passing with mean aggregation
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false
  gcn_mega:
    description: GCN-style symmetric degree normalization D^(-1/2) A D^(-1/2)
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false
  gat_mega:
    description: Multi-head attention with learned edge importance weights
    embedding_dim: 128
    n_layers: 3
    dropout: 0.1
    use_instance_norm: false
    n_heads: 4
environment:
  name: mvrpbtw
  properties:
    max_coord: 100.0
    capacity_truck: 200
    capacity_drone: 20
    v_truck_km_h: 40.0
    v_drone_km_h: 60.0
    truck_cost_unit: 1.0
    drone_cost_unit: 0.5
    fleet_basis_cost: 50
    t_max_system_h: 24.0
    drone_duration_h: 1.0
    drone_takeoff_min: 1.0
    drone_landing_min: 1.0
    service_time_min: 5.0
    demand_min: 1
    demand_max: 30
    time_window_scaling_factor: 1.5
    tasks:
    - 003_N10_F2_R
device: cpu
reproducibility:
  seed:
    random_seed: 42
    numpy_seed: 42
    torch_seed: 42
experiment:
  name: MLP_PPO_N10_R
  description: mvrpbtw experiment
logger:
  base_dir: experiment/train
  verbose: true
  tensorboard: false
